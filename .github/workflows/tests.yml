name: tests
on: [push, pull_request]
jobs:
  fast-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q   # synthetic fixtures only; -m realdata tests need the M5 data and are excluded
