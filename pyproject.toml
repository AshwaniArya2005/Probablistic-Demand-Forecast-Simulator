[project]
name = "probabilistic-demand-forecasting-simulator"
version = "0.1.0"
requires-python = "==3.12.*"
# Exact pins. Later phases add their own (shap, fastapi...) when first needed.
dependencies = [
    "matplotlib==3.11.2",
    "numpy==2.2.6",
    "pandas==2.3.3",
    "pyarrow==21.0.0",
    "scikit-learn==1.9.1",
    "tabulate==0.9.0",
    "xgboost==3.4.1",
]

[tool.uv]
package = false

[dependency-groups]
api = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "uvicorn>=0.53.0",
]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["ml", "api"]
# fast suite by default; real-data tests need data/processed (run: uv run pytest -m realdata)
addopts = "-m 'not realdata'"
markers = ["realdata: needs data/processed built from the M5 files; not run in CI"]
