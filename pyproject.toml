[project]
name = "probabilistic-demand-forecasting-simulator"
version = "0.1.0"
requires-python = "==3.12.*"
# Exact pins. Later phases add their own (scikit-learn, xgboost, shap, fastapi...) when first needed.
dependencies = [
    "matplotlib==3.11.2",
    "numpy==2.2.6",
    "pandas==2.3.3",
    "pyarrow==21.0.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["ml"]
# fast suite by default; real-data tests need data/processed (run: uv run pytest -m realdata)
addopts = "-m 'not realdata'"
markers = ["realdata: needs data/processed built from the M5 files; not run in CI"]
