# Local stack: Postgres + the Express demo API + (optionally) the FastAPI model service.
#   docker compose up -d db
#   docker compose run --rm -e DATABASE_URL=postgres://demo:demo@db:5432/demo server node scripts/load.js            # scenarios (aggregates)
#   docker compose run --rm -e DATABASE_URL=postgres://demo:demo@db:5432/demo server node scripts/load.js --quantiles   # local only, per-series tables
#   docker compose up -d server            -> http://localhost:3000/health/deep
#   docker compose --profile models up -d model-api   (needs models/serving/ from ml/export_models.py; the public demo does not use it)
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: demo, POSTGRES_PASSWORD: demo, POSTGRES_DB: demo }
    ports: ["127.0.0.1:5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U demo"], interval: 3s, retries: 20 }
  server:
    build: { context: ., dockerfile: server/Dockerfile }
    environment: { DATABASE_URL: "postgres://demo:demo@db:5432/demo", DATABASE_SSL: "off", CORS_ORIGIN: "*" }
    ports: ["127.0.0.1:3000:3000"]
    depends_on: { db: { condition: service_healthy } }
  model-api:
    profiles: ["models"]
    build: { context: ., dockerfile: api/Dockerfile }
    environment: { API_KEY: "${API_KEY:-change-me}" }
    volumes: ["./models/serving:/models:ro"]
    ports: ["127.0.0.1:8000:8000"]
